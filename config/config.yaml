unitree:
  # DDS domain id (default 0; change to isolate multiple robots on one network)
  domain_id: 0
  # DDS interface. "lo" = simulator (same-host) — the safe default to clone
  # with. For a REAL robot set your robot-facing NIC and REBUILD/point config
  # at it: x86 workstation e.g. eno2, onboard Orin enP8p1s0 (check with
  # `ip -br addr`). lowstate/lowcmd never arrive on "lo", so a real run left
  # on "lo" just waits for robot state forever.
  network_interface: lo

planner:
  # ONNX file; the wrapper caches the built engine next to it as .trt
  model_path: models/planner_sonic.onnx
  # TensorRT precision: fp16 or fp32
  precision: fp16
  # Default standing height used for the initial context (gear_sonic default)
  default_height: 0.788740
  # Random seed fed to the planner model (gear_sonic initial_random_seed)
  initial_random_seed: 1234

control:
  # Encoder: motion observation [1762] -> token [64]
  encoder_path: models/model_encoder.onnx
  # Decoder (policy): observation [994] -> joint action [29]
  decoder_path: models/model_decoder.onnx

hand:
  # Dex3-1 feedback guard (hand_guard.hpp). All keys optional.
  guard_enabled: true
  # PD gains while hand state is fresh
  kp: 1.5
  kd: 0.1
  # stall torque bound -> e_max = tau_max / kp (rad)
  tau_max: 0.6
  # stall latch: |q_des - q_meas| > err_th and |dq| < vel_th for time_s
  stall_err_th: 0.15
  stall_vel_th: 0.05
  stall_time_s: 0.3
  # while latched: q_cmd = q_meas + offset toward target, with kp_hold
  stall_offset: 0.05
  kp_hold: 1.5
  # motor temperature (°C) that latches immediately; 0 = off
  temp_max_c: 0
  # hand state older than this -> open-loop pass-through
  state_stale_ms: 100
